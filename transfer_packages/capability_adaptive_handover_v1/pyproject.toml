[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capability-adaptive-handover-v1"
version = "0.1.0"
description = "Isolated capability-adaptive A* demonstration replay experiment."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
