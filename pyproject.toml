[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astar-d3qn-workshop"
version = "0.1.0"
description = "A* demonstration replay with Dueling Double DQN for grid navigation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

