inherits: asvc_persistent_teaching_v1.yaml
experiment:
  name: asvc_persistent_paper_completion_v1
  protocol: persistent_supervision_module_removals_and_frozen_density_v1
  output_root: outputs/asvc_persistent_paper_completion_v1
  check_root: results/asvc_persistent_paper_completion_v1
paper_completion:
  seeds: [0, 1, 2, 3, 4]
  methods: [no_td, no_advice]
  supervision_floor: 0.1
  advice_floor: 0.0
  registration_root: data/asvc_persistent_paper_completion_v1
  environment_steps: 200000
  final_checkpoint_only: true
  density_registration_root: data/asvc_paper_density_v2
  densities: [1, 3, 5, 7]
  scenes_per_density: 500
  evaluation_device: cpu
  reuse_no_supervision: advice_bound
  numerical_failure_policy: retain_seed_and_report_no_retraining_or_tuning
