   <g id="text_1">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(49.547109 84.783375)">Observation</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(41.251641 94.861406)">local static map</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(20.051719 104.939437)">3 dynamic frames + goal</text>
   </g>
   <g id="text_2">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(186.714844 84.783375)">Dueling Double DQN</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(195.000469 94.861406)">static legal mask</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(176.058984 104.939437)">epsilon-greedy candidate</text>
   </g>
   <g id="text_3">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(345.773672 84.783375)">Training action advice</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(352.174219 94.861406)">probability 0.8 to 0</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(361.76625 104.939437)">OFF from 100k</text>
   </g>
   <g id="text_4">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(514.248047 84.783375)">Real environment step</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(520.801875 94.861406)">uniform FIFO replay</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(515.865234 104.939437)">actual action retained</text>
   </g>
   <g id="text_5">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(183.277266 184.575375)">Static-map A* teacher</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(195.226875 194.653406)">observed-history</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(213.242344 204.731437)">risk filter</text>
   </g>
   <g id="text_6">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(349.455938 184.575375)">Independent teacher label</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(355.649062 194.653406)">margin loss, margin 0.8</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(347.203125 204.731437)">weight max(0.1, 1 - t/100k)</text>
   </g>
   <g id="text_7">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(541.951172 184.575375)">TD loss on actual action</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(556.935469 194.653406)">full TD target clip</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(579.305391 204.731437)">[-6, 10]</text>
   </g>
   <g id="text_8">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(471.0375 292.178391)">Online optimization</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(428.992031 302.256422)">TD loss + persistent weak supervision</text>
   </g>
   <g id="text_9">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(83.196563 292.683375)">Autonomous evaluation: final 200k model</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(99.735469 302.761406)">epsilon = 0; static legal mask only</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(92.089688 312.839437)">no A* advice or dynamic action shield</text>
   </g>
