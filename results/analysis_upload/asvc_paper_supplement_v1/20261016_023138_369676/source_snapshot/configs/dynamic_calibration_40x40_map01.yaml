experiment:
  name: dynamic_calibration_40x40_map01_three_crossing_shared
  seed: 0
  output_root: outputs/dynamic_calibration_40x40_map01_three_crossing
  independent_maps: true

map:
  generator: structured_layout_v1
  scene: calibration_40x40_map_01
  size: 40
  start: [1, 1]
  goal: [39, 39]

map_sets:
  train:
    count: 5
    file: maps/structured_calibration_40x40/maps.json

environment:
  kind: dynamic
  observation: local_static_dynamic_history_goal_vector
  spatial_channels: 4
  window_size: 15
  max_steps: 600
  action_count: 5
  terminate_on_collision: false

dynamic_obstacle:
  scenario: strategy_crossing
  count: 3
  planning: ignored_by_astar
  motion: deterministic_bounce
  speed_semantics: move_every_environment_steps
  placement_basis: three_strategy_specific_completed_static_final_greedy_paths_shared_environment
  route_length: 5
  random_seed: 8400
  selected_reference_indices:
    uniform: 63
    prefill: 31
    persistent_demo: 46

reward:
  step: -0.01
  progress: 0.05
  stay: -0.05
  collision: -1.0
  goal: 10.0

demonstrations:
  episodes: 20
  seed: 8400
  file: data/demonstrations/dynamic_calibration_40x40_map01_three_crossing/map_{map_number:02d}_seed_{map_seed}_astar_demos.npz

time_scale:
  cell_size_m: 0.5
  environment_step_s: 0.5
  agent_speed_m_per_s: 1.0

agent:
  learning_rate: 0.0003
  gamma: 0.99
  target_sync_interval: 250
  gradient_clip_norm: 10.0
  hidden_dim: 256
  device: auto

training:
  episodes: 1500
  replay_capacity: 10000
  batch_size: 64
  learning_starts: 64
  updates_per_step: 1
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_episodes: 1200
  replay_strategy: persistent_demo
  demo_fraction: 0.25
  progress_interval: 100
