    <text style="font: 9px 'DejaVu Sans'" transform="translate(649.698047 172.221469)">[−6, 10]</text>
   </g>
   <g id="text_7">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(365.227031 163.153406)">Margin loss on independent a*</text>
