    <text style="font: 9px 'DejaVu Sans'" transform="translate(45.772734 96.625406)">Observation s</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(21.819375 106.703437)">static + dynamic history</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(35.574609 116.781469)">goal displacement</text>
   </g>
   <g id="text_2">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(183.924844 71.677406)">Dueling Double DQN</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(192.210469 81.755437)">static legal mask</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(195.399141 91.833469)">ε-greedy action</text>
   </g>
   <g id="text_3">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(192.108516 160.381406)">Static A* teacher</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(187.966406 170.459438)">observed-risk filter</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(183.201328 180.537469)">independent label a*</text>
   </g>
   <g id="text_4">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(336.85875 71.677406)">Decaying action advice</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(336.833438 81.755437)">execute actual action a</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(339.653672 91.833469)">real environment step</text>
   </g>
   <g id="text_5">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(500.830313 71.677406)">Uniform FIFO replay</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(495.462656 81.755437)">(s, a, r, s′, terminated)</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(496.335234 91.833469)">actual action retained</text>
   </g>
   <g id="text_6">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(630.042891 152.065406)">TD loss on Q(s,a)</text>
