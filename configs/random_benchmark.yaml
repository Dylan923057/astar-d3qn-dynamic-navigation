experiment:
  name: random_benchmark_v1
  seed: 0
  output_root: outputs/random_benchmark

map:
  generator: astar_iddqn_style_random_v1
  size: 20
  density: 0.20
  start: [1, 1]
  goal: [18, 18]
  endpoint_clearance: 1
  min_path_steps: 36
  max_path_steps: 90
  min_turns: 2
  max_attempts: 5000

map_sets:
  train:
    seed_start: 2000
    count: 5
    file: maps/random_benchmark/train/maps.json

environment:
  observation: local_static_grid_goal_vector
  window_size: 11
  max_steps: 350
  action_count: 5
  terminate_on_collision: false

reward:
  step: -0.01
  progress: 0.05
  stay: -0.05
  collision: -1.0
  goal: 10.0

demonstrations:
  episodes: 20
  seed: 7000
  file: data/demonstrations/train_astar_demos.npz

agent:
  learning_rate: 0.0003
  gamma: 0.99
  target_sync_interval: 250
  gradient_clip_norm: 10.0
  hidden_dim: 256
  device: auto

training:
  episodes: 1500
  replay_capacity: 10000
  batch_size: 64
  learning_starts: 64
  updates_per_step: 1
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_episodes: 1200
  replay_strategy: persistent_demo
  demo_fraction: 0.25
  progress_interval: 100
